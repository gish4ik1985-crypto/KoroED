<script>
'use strict';
/* =====================================================================
   LYCTUS / KORoED — аркада про короеда внутри дерева (по концепт-документу rev.5).
   Дерево = зоны Корни → Ствол → Ветви, в каждой подуровни-лабиринты.
   Цель: собрать личинок (минимум 4 из 5) и вылететь, пока дерево не срубили.
   ===================================================================== */
const S = 8, VW = 120, VH = 80, K = 2, RB = 4;   // S — экранных px на клетку, RB — px буфера на клетку
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif';
const off = document.createElement('canvas'); off.width = (VW + 2) * RB; off.height = (VH + 2) * RB;
const octx = off.getContext('2d'), vimg = octx.createImageData(off.width, off.height);
const mmC = document.createElement('canvas'), mmX = mmC.getContext('2d');

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s | 0, 1442695041) | 0; n = Math.imul(n ^ n >>> 13, 1274126177); return ((n ^ n >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, f = t => t * t * (3 - 2 * t);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * f(xf) + (c - a) * f(yf) + (a - b - c + d) * f(xf) * f(yf);
}
const fbm = (x, y, s) => vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 7) * .28 + vnoise(x * 4.3, y * 4.3, s + 13) * .12;
const pick = (arr, rng) => arr[(rng() * arr.length) | 0];
function pnoise(x, y, px, py, s) { // периодический шум
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, f = t => t * t * (3 - 2 * t), m = (a, n) => ((a % n) + n) % n;
  const h = (a, b) => hash2(m(a, px), m(b, py), s);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * f(xf) + (c - a) * f(yf) + (a - b - c + d) * f(xf) * f(yf);
}
const GRAIN = new Float32Array(256 * 256);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++)
  GRAIN[y * 256 + x] = pnoise(x / 4, y / 32, 64, 8, 3) * .55 + pnoise(x / 2, y / 16, 128, 16, 4) * .3 + hash2(x, y, 9) * .15;

// ---------- текст ----------
function ft(s, x, y) { ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(8,6,2,.85)'; ctx.strokeText(s, x, y); ctx.fillText(s, x, y); }
function txt(s, x, y, size, col, al, bold) { ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT; ctx.fillStyle = col; ctx.textAlign = al || 'center'; ft(s, x, y); }
function wrap(s, x, y, w, size, col, al, lh) {
  ctx.font = size + 'px ' + FONT; const words = s.split(' '); let line = '', yy = y; lh = lh || size + 5;
  for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > w && line) { txt(line, x, yy, size, col, al); line = wd; yy += lh; } else line = t; }
  txt(line, x, yy, size, col, al); return yy;
}
function rrect(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function panel(x, y, w, h, a) { rrect(x, y, w, h, 14); ctx.fillStyle = `rgba(10,12,7,${a || .82})`; ctx.fill(); ctx.strokeStyle = 'rgba(160,130,70,.55)'; ctx.lineWidth = 1.5; ctx.stroke(); }

// ---------- кнопки (мышь + горячие клавиши) ----------
let btns = [], mouse = { x: -1, y: -1 };
function btn(label, x, y, w, h, fn, o) {
  o = o || {};
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h, dis = !!o.disabled, r = Math.min(12, h / 2);
  ctx.save();
  if (!dis) { ctx.shadowColor = hov ? 'rgba(255,200,90,.45)' : 'rgba(0,0,0,.55)'; ctx.shadowBlur = hov ? 16 : 8; ctx.shadowOffsetY = 2; }
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (dis) { g.addColorStop(0, '#26231a'); g.addColorStop(1, '#1b1912'); }
  else if (o.sel) { g.addColorStop(0, '#b0863a'); g.addColorStop(1, '#6e5020'); }
  else if (hov) { g.addColorStop(0, '#8a6a30'); g.addColorStop(1, '#4e3a18'); }
  else { g.addColorStop(0, '#4a3e22'); g.addColorStop(1, '#2a2312'); }
  rrect(x, y, w, h, r); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  rrect(x + 1.5, y + 1.5, w - 3, h * .45, r - 1); ctx.fillStyle = dis ? 'rgba(255,255,255,.02)' : 'rgba(255,240,200,.08)'; ctx.fill();
  rrect(x, y, w, h, r); ctx.strokeStyle = o.sel ? '#ffd98a' : dis ? '#3a3622' : hov ? '#e0b860' : '#8a7440'; ctx.lineWidth = o.sel ? 2.5 : 1.5; ctx.stroke();
  ctx.font = (o.bold === false ? '' : 'bold ') + (o.size || 17) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = dis ? '#7a7560' : '#fff8e8';
  if (o.sub) { ft(label, x + w / 2, y + h / 2 - 2); ctx.font = '13px ' + FONT; ctx.fillStyle = dis ? '#6a6550' : '#e0d6b4'; ft(o.sub, x + w / 2, y + h / 2 + 16); }
  else ft(label, x + w / 2, y + h / 2 + (o.size || 17) * .35);
  if (!dis) btns.push({ x, y, w, h, fn, key: o.key });
}

// ===================== ЗВУК =====================
let AC = null, master = null, noiseBuf = null;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sndNoise(freq, dur, vol, q) {
  if (!AC || !meta.sound) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = .8 + Math.random() * .5;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.5;
  const g = AC.createGain(), t = AC.currentTime; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + .05);
}
function sndTone(freq, dur, vol, type, slide) {
  if (!AC || !meta.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function sndSweep(f0, f1, dur, vol, q) { // шуршащий «вжух» (шум с бегущим фильтром)
  if (!AC || !meta.sound) return;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; const f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  f.type = 'bandpass'; f.Q.value = q || 3; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()); src.stop(t + dur + .05);
}
function pluck(f, v, len) {
  if (!AC || !meta.sound) return;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; len = len || 1.2;
  o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2.01;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + len);
  o.connect(g); o2.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t + len + .05); o2.stop(t + len + .05);
}
const sfx = {
  // хруст: щелчок волокон + «тело» укуса; плотная древесина звучит ниже и глуше
  chew: d => { const r = Math.random(); sndNoise(2600 + r * 1400 - d * 900, .03, .07, 3); sndNoise(420 + (1 - d) * 700 + r * 200, .07, .14 + d * .05, 1.6); },
  coin: () => { sndTone(1320, .07, .08, 'triangle'); setTimeout(() => sndTone(1980, .16, .07, 'triangle'), 55); },
  larva: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => pluck(f, .1, .6), i * 70)); },
  nyash: () => { sndTone(300, .35, .1, 'sine', 3); sndSweep(400, 3000, .35, .12); },
  hurt: () => { sndTone(110, .22, .3, 'sine', .5); sndNoise(260, .18, .25, 1); },
  peck: () => { sndTone(320, .05, .3, 'triangle', .55); sndNoise(1500, .035, .3, 5); },   // сухой деревянный «тук»
  warn: () => { sndTone(880, .08, .08, 'square'); setTimeout(() => sndTone(660, .1, .08, 'square'), 90); },
  kill: () => { sndNoise(700, .12, .25, 1.2); sndTone(420, .25, .14, 'triangle', .4); },
  portal: () => { sndSweep(200, 1600, .5, .14, 2); sndTone(220, .5, .06, 'sine', 2); },
  win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => pluck(f, .14, .9), i * 150)); },
  lose: () => { [392, 330, 262].forEach((f, i) => setTimeout(() => pluck(f, .12, 1.2), i * 260)); },
  click: () => sndTone(700, .04, .06, 'triangle'),

// ---------- фон: гул внутри дерева, скрипы, птицы снаружи; тихая мелодия в меню ----------
let amb = null, ambT = 2, musT = 0;
function ambientOn(on) {
  if (!AC) return;
  if (on && meta.sound && !amb) {
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240;
    const g = AC.createGain(), t = AC.currentTime; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + 1.5);
    src.connect(f); f.connect(g); g.connect(master); src.start(); amb = { src, g };
  } else if ((!on || !meta.sound) && amb) {
    const a = amb; amb = null; a.g.gain.linearRampToValueAtTime(0, AC.currentTime + .5); setTimeout(() => { try { a.src.stop(); } catch (e) {} }, 600);
  }
}
function creak() {
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime, f0 = 60 + Math.random() * 60, d = .8 + Math.random();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * (1.15 + Math.random() * .5), t + d);
  f.type = 'bandpass'; f.frequency.value = 450 + Math.random() * 500; f.Q.value = 9;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + d * .3); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function chirp() {
  const t0 = AC.currentTime, n = 2 + (Math.random() * 4 | 0), base = 2000 + Math.random() * 1800;
  for (let i = 0; i < n; i++) { const o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * (.09 + Math.random() * .06);
    o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * (1.2 + Math.random() * .4), t + .06);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.022, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + .09); o.connect(g); g.connect(master); o.start(t); o.stop(t + .1); }
}
function ambientTick(dt) {
  if (!AC || !meta.sound) return; ambT -= dt; if (ambT > 0) return; ambT = 2.5 + Math.random() * 5;
  const zone = G && G.sub ? G.sub.id[0] : 'A';
  if (Math.random() < (zone === 'C' ? .75 : zone === 'B' ? .35 : .12)) chirp(); else creak();
}
const PENTA = [220, 261.6, 293.7, 329.6, 392, 440, 523.3, 587.3];

function musicTick(dt) {
  if (!AC || !meta.sound) return; musT -= dt; if (musT > 0) return; musT = .45; musStep++;
