}

// ===================== ВВОД / ЦИКЛ =====================
function logical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * 960 / r.width, y: (e.clientY - r.top) * 640 / r.height }; }
addEventListener('keydown', e => {

  if (state === 'pause' && (e.code === 'KeyP' || e.code === 'Escape')) { state = 'play'; return; }

});

cv.addEventListener('pointerdown', e => {

  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { if (state !== 'play') sfx.click(); b.fn(); return; } }
  if (state === 'play') ptr = p;
});
cv.addEventListener('pointermove', e => { mouse = logical(e); if (ptr) ptr = mouse; });
addEventListener('pointerup', () => { ptr = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, 960, 640); btns = [];

requestAnimationFrame(frame);
// хуки для автотестов
window.__k = { update: dt => update(dt), startRun, get G() { return G; }, get state() { return state; }, set state(v) { state = v; }, keys, meta, TREES, finish, genSub, pickup, SPECIES, bfsField, enterSub };
